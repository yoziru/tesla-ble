name: Python Wheels

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: manylinux, arch: x86_64}
          - {runner: ubuntu-24.04, platform: musllinux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: manylinux, arch: aarch64}
          - {runner: ubuntu-24.04-arm, platform: musllinux, arch: aarch64}
          - {runner: macos-15-intel, platform: macosx, arch: x86_64}
          - {runner: macos-15, platform: macosx, arch: arm64}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0

      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: cp313-${{ matrix.platform }}* cp314-${{ matrix.platform }}* cp315-${{ matrix.platform }}*

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/check_dist.py wheelhouse

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      # The sdist contains the whole C++ library and builds wheels standalone.
      - run: pipx run build --sdist .
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  validate_dist:
    name: Validate complete release matrix
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/check_dist.py --release-matrix dist
      - run: python scripts/test_check_dist.py

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [validate_dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
