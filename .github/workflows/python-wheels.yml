name: Python Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
        with:
          platforms: arm64

      # Configuration (build/skip, archs, test command) lives in
      # pyproject.toml [tool.cibuildwheel]; aarch64 Linux runs under QEMU,
      # x86_64 macOS cross-compiles from the arm64 runner.
      # Temporary: cibuildwheel main carries Python 3.15 support (not yet in
      # 4.3.1); bump to the next release tag when available.
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/check_dist.py wheelhouse
      - run: python scripts/check_dist.py --linux-matrix wheelhouse
        if: runner.os == 'Linux'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The sdist contains the whole C++ library and builds wheels standalone.
      - run: pipx run build --sdist .
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
